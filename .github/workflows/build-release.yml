name: Build & Release Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Ebook1BitOptimizer" gui.py
          Compress-Archive -Path dist/Ebook1BitOptimizer -DestinationPath dist/Ebook1BitOptimizer-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ebook1BitOptimizer-Windows
          path: dist/Ebook1BitOptimizer-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS App Bundle
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Ebook1BitOptimizer" gui.py
          cd dist
          zip -r Ebook1BitOptimizer-macOS.zip Ebook1BitOptimizer.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ebook1BitOptimizer-macOS
          path: dist/Ebook1BitOptimizer-macOS.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Ebook1BitOptimizer-Windows

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Ebook1BitOptimizer-macOS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Ebook1BitOptimizer-Windows.zip
            Ebook1BitOptimizer-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
